
name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev ccache \
            libltdl-dev patch

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            Cython==0.29.34 \
            buildozer==1.5.0 \
            pytest requests pillow

      - name: Check Required Files
        run: |
          test -f buildozer.spec
          test -f requirements.txt
          test -f jarvis/main.py
          echo "Required files found."

      - name: Run Tests If Present
        run: |
          if [ -d tests ] && find tests -type f \
            \( -name 'test_*.py' -o -name '*_test.py' \) \
            | grep -q .; then
            python -m pytest tests/ -v
          else
            echo "No test files found; skipping tests."
          fi

      - name: Check Python Syntax
        run: |
          python -m compileall -q jarvis

      - name: Clean Previous Build
        run: |
          buildozer android clean

      - name: Build Debug APK
        run: |
          yes | buildozer -v android debug

      - name: Verify APK
        run: |
          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
          ls -lh bin/*.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-build-logs
          path: .buildozer/
          if-no-files-found: warn
          retention-days: 7
